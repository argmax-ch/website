<footer class="site-footer">
  {%- for link in config.extra.footer %}
  {%- if not loop.first %}
  <span class="separator">|</span>
  {%- endif %}
  <a href="{% if link.url is starting_with("/") %}{{ get_url(path=link.url) | safe }}{% else %}{{ link.url | safe }}{% endif %}">{{ link.name }}</a>
  {%- endfor %}
</footer>
