<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="icon" href="{{ get_url(path='images/favicon.svg') }}" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }} Blog" href="{{ get_url(path='atom.xml', trailing_slash=false) }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ get_url(path='css/styles.css', cachebust=true) }}">
  {%- if page.extra.math | default(value=false) or config.extra.math | default(value=false) %}
  {% include "partials/katex.html" %}
  {%- endif %}
</head>
<body class="{% block body_class %}{% endblock body_class %}">
  {% include "partials/header.html" %}
  {% block content %}{% endblock content %}
</body>
</html>
